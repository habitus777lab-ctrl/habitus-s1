<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habitus Speaking</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: #e0e7ff;
    --secondary: #10b981;
    --accent: #f43f5e;
    --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    --card-bg: rgba(255, 255, 255, 0.95);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.08), 0 8px 10px -6px rgba(99, 102, 241, 0.08);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* Header */
.header {
    height: 75px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border-color);
}

.text-logo {
    position: absolute;
    left: 24px;
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

.title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
}

/* Container */
.container {
    width: 100%;
    max-width: 680px;
    margin: 40px auto;
    padding: 36px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 28px;
    box-shadow: var(--shadow);
}

/* Progress Area */
.progress-area {
    margin-bottom: 24px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #f1f5f9;
    border-radius: 999px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Round Area */
.round-area {
    text-align: center;
    margin-bottom: 24px;
}

.round-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.instruction {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
}

/* Sentence Box */
.sentence-box {
    margin: 20px 0 28px 0;
    padding: 36px 28px;
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: all 0.3s ease;
}

.sentence-box.fade-in {
    animation: fadeIn 0.35s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

#sentenceDisplay {
    font-size: 24px;
    line-height: 1.6;
    font-weight: 700;
    color: var(--text-main);
    word-break: keep-all;
}

#koreanTranslate {
    margin-top: 16px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text-muted);
    font-weight: 500;
    word-break: keep-all;
}

.hidden-word {
    display: inline-block;
    margin: 0 4px;
    padding: 2px 10px;
    color: transparent;
    background: #cbd5e1;
    border-radius: 6px;
    user-select: none;
    transition: background 0.2s;
}

/* Round Dots */
.round-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
}

.round-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f1f5f9;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border-color);
}

.round-dot.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.round-dot.done {
    background: var(--secondary);
    color: white;
    border-color: var(--secondary);
}

/* Controls */
.controls {
    display: flex;
    gap: 12px;
}

.main-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.main-btn:active {
    transform: scale(0.98);
}

.prev {
    background: #f1f5f9;
    color: var(--text-muted);
}
.prev:hover {
    background: #e2e8f0;
}

.next {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
}
.next:hover {
    background: var(--primary-hover);
}

.complete {
    background: var(--secondary);
    color: white;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    display: none;
}

/* Tip */
.tip {
    margin-top: 24px;
    padding: 16px 20px;
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-muted);
}

.tip strong {
    color: var(--text-main);
}

/* Footer */
.footer {
    text-align: center;
    margin: 24px 0;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
}

/* Responsive */
@media (max-width: 640px) {
    .container {
        margin: 16px;
        padding: 24px 20px;
        border-radius: 20px;
    }
    .text-logo {
        left: 16px;
        font-size: 18px;
    }
    #sentenceDisplay {
        font-size: 20px;
    }
    #koreanTranslate {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="text-logo">Habitus</div>
    <div class="title">Habitus Speaking</div>
</div>

<div class="container">
    <!-- Progress Bar -->
    <div class="progress-area">
        <div class="progress-text">
            <span id="progressText">Sentence 1 / 46</span>
            <span id="percentText">0%</span>
        </div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
    </div>

    <!-- Round Badge & Instruction -->
    <div class="round-area">
        <div id="roundBadge" class="round-badge">1회차</div>
        <div id="instruction" class="instruction">영어 문장과 뜻을 보며 소리 내어 읽어 보세요.</div>
    </div>

    <!-- Sentence Box -->
    <div class="sentence-box" id="sentenceBox">
        <div id="sentenceDisplay">Loading...</div>
        <div id="koreanTranslate">...</div>
    </div>

    <!-- Round Dots Indicator -->
    <div class="round-dots">
        <div id="round1" class="round-dot active">1</div>
        <div id="round2" class="round-dot">2</div>
        <div id="round3" class="round-dot">3</div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button id="prevBtn" class="main-btn prev" onclick="previousSentence()">
            ← 이전
        </button>
        <button id="nextBtn" class="main-btn next" onclick="nextStep()">
            다음 회차 →
        </button>
        <button id="completeBtn" class="main-btn complete" onclick="nextSentence()">
            다음 문장 →
        </button>
    </div>

    <!-- Study Tip -->
    <div class="tip">
        <strong>Speaking 3-Step Guide</strong><br>
        ① 문장과 뜻을 보며 정확하게 읽기 &nbsp;|&nbsp; 
        ② 영어만 보고 읽기 &nbsp;|&nbsp; 
        ③ 핵심 단어를 기억하며 읽기
    </div>
</div>

<div class="footer">
    ⓒ Violet Youn Habitus. All Rights Reserved.
</div>

<script>
/* =========================================================
   SPEAKING SENTENCES
   ========================================================= */
const sentences = [
{ en: "What do you want to do in the future?", ko: "너는 미래에 무엇을 하고 싶니?" },
{ en: "Parents and teachers ask students this question all the time.", ko: "부모님과 선생님들은 항상 학생들에게 이 질문을 한다." },
{ en: "But how many students actually know what they want to do in the future?", ko: "하지만 실제로 미래에 무엇을 하고 싶은지 알고 있는 학생은 얼마나 될까?" },
{ en: "Many students are either unsure of what they know or confused about how to find the right career.", ko: "많은 학생들은 자신이 무엇을 알고 있는지 확신하지 못하거나 올바른 진로를 어떻게 찾아야 할지 혼란스러워한다." },
{ en: "The following may help students discover a new way to look at themselves and design a path for their future.", ko: "다음 내용은 학생들이 자신을 바라보는 새로운 방법을 발견하고 미래를 위한 길을 설계하는 데 도움이 될 수 있다." },
{ en: "It's hard to climb a mountain without preparation, and designing a career path requires preparation too.", ko: "준비 없이 산을 오르기는 어렵고, 진로를 설계하는 데에도 준비가 필요하다." },
{ en: "Begin your career map by taking a blank piece of paper and drawing some dots on it.", ko: "빈 종이 한 장을 가져와 그 위에 점을 몇 개 그리는 것으로 진로 지도를 시작해 보자." },
{ en: "These dots will be a representation of who you are at this moment in time, so make as many dots as you can.", ko: "이 점들은 지금 이 순간의 당신이 누구인지를 나타내므로 가능한 한 많은 점을 만들어 보자." },
{ en: "Write one or two words to describe one aspect of yourself next to each dot.", ko: "각 점 옆에 자신의 한 가지 측면을 설명하는 한두 단어를 써 보자." },
{ en: "Awards, certifications, and courses taken at school are great places to start.", ko: "수상 경력, 자격증, 학교에서 수강한 과목들은 시작하기에 좋은 소재이다." },
{ en: "You can also think about your past and present achievements, interests, and strengths.", ko: "과거와 현재의 성취, 관심사, 그리고 강점에 대해서도 생각해 볼 수 있다." },
{ en: "Parents, teachers, friends, and others you trust can also provide insight into you that you may not have noticed.", ko: "부모님, 선생님, 친구들, 그리고 당신이 신뢰하는 다른 사람들은 당신이 미처 알아차리지 못했던 자신에 대한 통찰을 제공할 수도 있다." },
{ en: "If you think it describes you, write it down as a new dot.", ko: "그것이 자신을 잘 설명한다고 생각한다면 새로운 점으로 적어 보자." },
{ en: "Hopefully doing this exercise will show you that there's more to being you than you may have thought.", ko: "바라건대 이 활동을 통해 당신이 생각했던 것보다 자신에게 더 많은 것이 있다는 것을 알게 될 것이다." },
{ en: "Now, take a step back and look at your dots.", ko: "이제 한 걸음 물러서서 자신의 점들을 살펴보자." },
{ en: "A good idea at this stage is to start categorizing your dots.", ko: "이 단계에서 좋은 방법은 자신의 점들을 분류하기 시작하는 것이다." },
{ en: "Do you see any patterns emerging?", ko: "어떤 패턴이 나타나는 것이 보이는가?" },
{ en: "For example, you might have several dots that highlight scientific skills or maybe some dots that point to creativity.", ko: "예를 들어 과학적 능력을 강조하는 여러 점이나 창의성을 가리키는 점들이 있을 수 있다." },
{ en: "These patterns may point to something that is meaningful to you.", ko: "이러한 패턴들은 당신에게 의미 있는 무언가를 가리킬 수도 있다." },
{ en: "Another perspective is to look at what is missing from your map, which you can call 'gaps.'", ko: "또 다른 관점은 자신의 지도에서 빠져 있는 것을 살펴보는 것이며, 이것을 '공백'이라고 부를 수 있다." },
{ en: "For example, you may feel that you need some work on mathematics or a foreign language.", ko: "예를 들어 수학이나 외국어를 더 공부할 필요가 있다고 느낄 수 있다." },
{ en: "At such a young age, you probably don't have certain skills.", ko: "그렇게 어린 나이에는 아마도 아직 갖추지 못한 기술들이 있을 것이다." },
{ en: "Your technical knowledge might be at a beginner level, or your physical conditioning might need work.", ko: "기술적 지식이 초보 수준일 수도 있고 신체적인 단련이 더 필요할 수도 있다." },
{ en: "Noticing these gaps will help you in the next steps of your map.", ko: "이러한 공백을 알아차리는 것은 지도의 다음 단계를 진행하는 데 도움이 될 것이다." },
{ en: "By comparing your strengths and weaknesses, or the dots and the gaps, your map should show you what you possess and what you need to work on.", ko: "자신의 강점과 약점, 즉 점과 공백을 비교하면 지도는 자신이 무엇을 가지고 있고 무엇을 노력해야 하는지를 보여 줄 것이다." },
{ en: "Now, think of a long-term goal, like becoming a musician.", ko: "이제 음악가가 되는 것과 같은 장기적인 목표를 생각해 보자." },
{ en: "Your goal doesn't have to be realistic.", ko: "당신의 목표가 반드시 현실적일 필요는 없다." },
{ en: "Remember that the purpose of having the goal clearly written is to map out a way to get there.", ko: "목표를 명확하게 적는 목적은 그 목표에 도달할 방법을 그려 보는 것임을 기억하자." },
{ en: "Understanding where you want to go is an important step, so the next step is laying out a plan to push on to that goal.", ko: "자신이 어디로 가고 싶은지 이해하는 것은 중요한 단계이므로 다음 단계는 그 목표를 향해 나아가기 위한 계획을 세우는 것이다." },
{ en: "To reach your goal of becoming a musician, you need to fill in the gaps between the dots to create a path toward your goal.", ko: "음악가가 되겠다는 목표에 도달하려면 점들 사이의 공백을 채워 목표를 향한 길을 만들어야 한다." },
{ en: "Do you need to work on voice techniques or set up a personal website to promote yourself first?", ko: "먼저 발성 기술을 연습하거나 자신을 홍보하기 위한 개인 웹사이트를 만들어야 할까?" },
{ en: "You can plan other paths by researching what essential skills, training or education, or type of personality you may need to achieve a particular goal.", ko: "특정 목표를 이루기 위해 어떤 필수 기술, 훈련이나 교육, 또는 어떤 성격이 필요한지 조사하면서 다른 경로도 계획할 수 있다." },
{ en: "Talking to or shadowing people considered to be successful is a great way to learn about a specific profession too.", ko: "성공한 사람으로 여겨지는 사람들과 이야기하거나 그들을 따라다니며 관찰하는 것도 특정 직업에 대해 배우는 좋은 방법이다." },
{ en: "As you fill in each gap with a new dot, you can decide what to do next.", ko: "각 공백을 새로운 점으로 채워 나가면서 다음에 무엇을 할지 결정할 수 있다." },
{ en: "Each path is unique and has different challenges.", ko: "각각의 길은 독특하며 서로 다른 도전 과제를 가지고 있다." },
{ en: "Now, instead of aimlessly trying random things, you can look at your map to see what to do next.", ko: "이제 무작정 아무것이나 시도하는 대신 자신의 지도를 보고 다음에 무엇을 해야 할지 알 수 있다." },
{ en: "Just look for a gap to fill.", ko: "채워야 할 공백을 찾아보자." },
{ en: "Deciding which gap to fill is up to you, but your dot map should show you that whatever you choose, you will be moving toward your goal.", ko: "어떤 공백을 채울지는 당신에게 달려 있지만, 자신의 점 지도는 무엇을 선택하든 목표를 향해 나아가고 있다는 것을 보여 줄 것이다." },
{ en: "There is no need to rush anything though.", ko: "하지만 무엇이든 서두를 필요는 없다." },
{ en: "Take your time filling the gaps.", ko: "시간을 들여 천천히 공백을 채워 보자." },
{ en: "Since you've designed your own map, each gap you fill and dot you make 'levels you up.'", ko: "자신만의 지도를 설계했기 때문에 채우는 각각의 공백과 만드는 각각의 점이 당신의 수준을 한 단계씩 높여 준다." },
{ en: "If you've made it this far, you probably realize some dots will take time to complete, and other dots will take great effort.", ko: "여기까지 왔다면 어떤 점들은 완성하는 데 시간이 걸리고 다른 점들은 많은 노력이 필요하다는 것을 아마 깨달았을 것이다." },
{ en: "No one knows what kind of person you will be five or ten years down the road.", ko: "5년 또는 10년 후에 당신이 어떤 사람이 될지는 아무도 모른다." },
{ en: "Each investment you make in yourself now will grow into expertise and experience in the future.", ko: "지금 자신에게 하는 각각의 투자는 미래에 전문성과 경험으로 성장할 것이다." },
{ en: "The dots are a way to see yourself in the present and then imagine yourself in as many futures as you can.", ko: "점들은 현재의 자신을 바라보고 가능한 한 많은 미래의 자신의 모습을 상상하는 방법이다." },
{ en: "It's up to you to start connecting your dots now.", ko: "지금 자신의 점들을 연결하기 시작하는 것은 당신에게 달려 있다." }
];

let currentIndex = 0;
let currentRound = 1;

function loadSentence() {
    const sentence = sentences[currentIndex];
    document.getElementById("koreanTranslate").innerText = sentence.ko;
    updateRound();
    updateProgress();
    triggerAnimation();
}

function triggerAnimation() {
    const box = document.getElementById("sentenceBox");
    box.classList.remove("fade-in");
    void box.offsetWidth; // trigger reflow
    box.classList.add("fade-in");
}

function updateRound() {
    const sentence = sentences[currentIndex];
    const display = document.getElementById("sentenceDisplay");
    const badge = document.getElementById("roundBadge");
    const instruction = document.getElementById("instruction");

    if (currentRound === 1) {
        display.innerText = sentence.en;
        badge.innerText = "1회차";
        instruction.innerText = "영어 문장과 뜻을 보며 소리 내어 읽어 보세요.";
    } else if (currentRound === 2) {
        display.innerText = sentence.en;
        badge.innerText = "2회차";
        instruction.innerText = "이번에는 영어 문장만 보고 소리 내어 읽어 보세요.";
    } else {
        display.innerHTML = hideWords(sentence.en);
        badge.innerText = "3회차";
        instruction.innerText = "가려진 단어를 기억하며 문장 전체를 소리 내어 읽어 보세요.";
    }

    updateRoundDots();
    updateButtons();
}

function hideWords(sentence) {
    const words = sentence.split(" ");
    const candidates = [];

    words.forEach((word, index) => {
        const cleanWord = word.replace(/[^a-zA-Z]/g, "");
        if (cleanWord.length >= 4) {
            candidates.push(index);
        }
    });

    const hideCount = Math.max(1, Math.floor(candidates.length * 0.35));
    const hideIndexes = [];

    for (let i = 0; i < hideCount; i++) {
        const position = Math.floor(i * candidates.length / hideCount);
        hideIndexes.push(candidates[position]);
    }

    return words.map((word, index) => {
        if (hideIndexes.includes(index)) {
            const cleanWord = word.replace(/[^a-zA-Z]/g, "");
            const punctuation = word.replace(/[a-zA-Z]/g, "");
            return `<span class="hidden-word">${cleanWord}</span>${punctuation}`;
        }
        return word;
    }).join(" ");
}

function updateRoundDots() {
    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById("round" + i);
        dot.className = "round-dot";
        if (i < currentRound) dot.classList.add("done");
        if (i === currentRound) dot.classList.add("active");
    }
}

function updateButtons() {
    const nextBtn = document.getElementById("nextBtn");
    const completeBtn = document.getElementById("completeBtn");
    const prevBtn = document.getElementById("prevBtn");

    if (currentRound < 3) {
        nextBtn.style.display = "flex";
        completeBtn.style.display = "none";
        nextBtn.innerText = "다음 회차 →";
    } else {
        nextBtn.style.display = "none";
        completeBtn.style.display = "flex";
        completeBtn.innerText = "다음 문장 →";
    }
    prevBtn.innerText = (currentIndex === 0 && currentRound === 1) ? "← 이전" : "← 이전";
}

function nextStep() {
    if (currentRound < 3) {
        currentRound++;
        updateRound();
        triggerAnimation();
    }
}

function nextSentence() {
    if (currentIndex < sentences.length - 1) {
        currentIndex++;
        currentRound = 1;
        loadSentence();
    } else {
        showCompletion();
    }
}

function previousSentence() {
    if (currentRound > 1) {
        currentRound--;
        updateRound();
        triggerAnimation();
        return;
    }

    if (currentIndex > 0) {
        currentIndex--;
        currentRound = 3;
        loadSentence();
        triggerAnimation();
    }
}

function updateProgress() {
    const total = sentences.length;
    const current = currentIndex + 1;

    document.getElementById("progressText").innerText = `Sentence ${current} / ${total}`;
    const percent = Math.round((currentIndex / total) * 100);
    document.getElementById("percentText").innerText = `${percent}%`;
    document.getElementById("progressFill").style.width = `${percent}%`;
}

function showCompletion() {
    document.getElementById("sentenceBox").innerHTML = `
        <div style="font-size:48px; margin-bottom:12px;">🎉</div>
        <div style="font-size:26px; font-weight:800; color:var(--primary);">Great Job!</div>
        <div style="margin-top:12px; font-size:15px; color:var(--text-muted); line-height:1.6;">
            모든 문장을 3회씩 완벽하게<br>소리 내어 읽었습니다.
        </div>
    `;

    document.getElementById("koreanTranslate").innerText = "";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("completeBtn").style.display = "none";
    document.getElementById("prevBtn").innerText = "← 처음부터 다시";
    document.getElementById("prevBtn").onclick = () => {
        currentIndex = 0;
        currentRound = 1;
        location.reload();
    };

    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("percentText").innerText = "100%";
}

// Initial Load
loadSentence();
</script>
